<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>배달앱 실시간 채팅</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        #chat-box {
            width: 400px;
            height: 300px;
            border: 1px solid #ccc;
            overflow-y: scroll;
            margin-bottom: 10px;
            padding: 10px;
        }

        .msg {
            margin-bottom: 5px;
        }

        .my-msg {
            color: blue;
            text-align: right;
        }

        .other-msg {
            color: green;
        }
    </style>
</head>
<body>

<h2>배달앱 1:1 채팅 테스트</h2>

<div id="status-bar">연결 끊김</div>

<hr/>

<div>
    <input type="text" id="sender" placeholder="이름 (예: 고객1)" value="고객1">
    <button onclick="connect()">접속하기</button>
</div>
<br/>
<div>
    <input type="text" id="message" placeholder="메시지를 입력하세요" style="width: 250px;">
    <button onclick="sendMessage()">전송</button>
</div>

<hr/>

<hr/>

<h3>🍗 메뉴 주문</h3>
<div>
    메뉴: <input type="text" id="menuName" value="황금올리브 치킨">
    가격: <input type="number" id="price" value="23000">
    <button onclick="order()">주문하기</button>
</div>
<div id="order-result" style="color: blue; font-weight: bold; margin-top: 10px;"></div>

<hr/>

<div style="background-color: #f0f8ff; padding: 10px; border: 2px dashed blue;">
    <h3>👨‍🍳 사장님 모드 (주문 알림)</h3>
    <button onclick="connectOwner()">가게 오픈 (알림 받기)</button>
    <div id="notification-box" style="color: red; font-weight: bold; margin-top: 10px;">
        (아직 주문 없음)
    </div>
</div>

<script>
    function order() {
        var menu = document.getElementById("menuName").value;
        var price = document.getElementById("price").value;

        fetch('/orders', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                customerId: document.getElementById("sender").value,
                restaurantId: "store1",
                menuName: menu,
                price: parseInt(price)
            })
        })
            .then(response => response.text())
            .then(data => {
                document.getElementById("order-result").innerText = "✅ " + data;
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById("order-result").innerText = "주문 실패";
            });
    }

    function connectOwner() {
        var socket = new SockJS('/ws-stomp');
        var ownerClient = Stomp.over(socket);

        ownerClient.connect({}, function (frame) {
            console.log('Owner Connected: ' + frame);
            alert("가게 오픈! 주문을 기다립니다.");

            // ⭐️ "/sub/orders" 채널 구독! (Controller가 여기로 쏨)
            ownerClient.subscribe('/sub/orders', function (msg) {
                var messageBody = msg.body;
                if (messageBody.includes("새 주문")) {
                    // 메시지에서 주문번호 추출 (간단 파싱)
                    var orderId = messageBody.split("주문번호: ")[1];

                    var html = `
                            <div style="border-bottom:1px solid #eee; padding:5px;">
                                ${messageBody}
                                <button onclick="acceptOrder('${orderId}')" style="background:red; color:white;">수락하기</button>
                            </div>
                        `;
                    document.getElementById("notification-box").innerHTML += html;
                } else {
                    // 일반 알림 (조리 중 등)
                    document.getElementById("notification-box").innerHTML += "<div style='color:green'>" + messageBody + "</div>";
                }
            });
        });
    }

    function acceptOrder(orderId) {
        fetch('/orders/accept', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'}, // 헤더 명시
            body: JSON.stringify({"orderId": orderId})     // 👈 객체로 묶어서 전송!
        }).then(() => {
            alert("주문을 수락했습니다! (조리 시작)");
        });
    }
</script>

<div id="chat-box"></div>

<script>
    var stompClient = null;

    // 1. 연결하기
    function connect() {
        var socket = new SockJS('/ws-stomp'); // WebSocketConfig에 설정한 엔드포인트
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function (frame) {
            console.log('Connected: ' + frame);
            document.getElementById("status-bar").innerHTML = "<b>연결됨!</b>";

            // 2. 구독하기 (누가 메시지 보내면 여기서 받음)
            stompClient.subscribe('/sub/chat', function (greeting) {
                showGreeting(JSON.parse(greeting.body));
            });
        });
    }

    // 3. 메시지 보내기
    function sendMessage() {
        var sender = document.getElementById("sender").value;
        var content = document.getElementById("message").value;

        if (stompClient && content) {
            // ChatController의 @MessageMapping("/chat")으로 전송
            // prefix "/pub"은 WebSocketConfig에서 설정함
            stompClient.send("/pub/chat", {}, JSON.stringify({
                'sender': sender,
                'content': content
            }));
            document.getElementById("message").value = ''; // 입력창 비우기
        }
    }

    // 4. 화면에 그리기
    function showGreeting(message) {
        var chatBox = document.getElementById("chat-box");
        var myName = document.getElementById("sender").value;

        var msgDiv = document.createElement("div");
        msgDiv.classList.add("msg");

        if (message.sender === myName) {
            msgDiv.classList.add("my-msg");
            msgDiv.innerHTML = "<b>나:</b> " + message.content;
        } else {
            msgDiv.classList.add("other-msg");
            msgDiv.innerHTML = "<b>" + message.sender + ":</b> " + message.content;
        }

        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight; // 스크롤 아래로
    }
</script>
</body>
</html>
