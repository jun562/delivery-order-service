<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>배달앱 실시간 채팅</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        #chat-box {
            width: 400px;
            height: 300px;
            border: 1px solid #ccc;
            overflow-y: scroll;
            margin-bottom: 10px;
            padding: 10px;
        }

        .msg {
            margin-bottom: 5px;
        }

        .my-msg {
            color: blue;
            text-align: right;
        }

        .other-msg {
            color: green;
        }
    </style>
</head>
<body>

<h2>배달앱 1:1 채팅 테스트</h2>

<div id="status-bar">연결 끊김</div>

<hr/>

<div>
    <input type="text" id="sender" placeholder="이름 (예: 고객1)" value="고객1">
    <button onclick="connect()">접속하기</button>
</div>
<br/>
<div>
    <input type="text" id="message" placeholder="메시지를 입력하세요" style="width: 250px;">
    <button onclick="sendMessage()">전송</button>
</div>

<hr/>

<div id="chat-box"></div>

<script>
    var stompClient = null;

    // 1. 연결하기
    function connect() {
        var socket = new SockJS('/ws-stomp'); // WebSocketConfig에 설정한 엔드포인트
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function (frame) {
            console.log('Connected: ' + frame);
            document.getElementById("status-bar").innerHTML = "<b>연결됨!</b>";

            // 2. 구독하기 (누가 메시지 보내면 여기서 받음)
            stompClient.subscribe('/sub/chat', function (greeting) {
                showGreeting(JSON.parse(greeting.body));
            });
        });
    }

    // 3. 메시지 보내기
    function sendMessage() {
        var sender = document.getElementById("sender").value;
        var content = document.getElementById("message").value;

        if (stompClient && content) {
            // ChatController의 @MessageMapping("/chat")으로 전송
            // prefix "/pub"은 WebSocketConfig에서 설정함
            stompClient.send("/pub/chat", {}, JSON.stringify({
                'sender': sender,
                'content': content
            }));
            document.getElementById("message").value = ''; // 입력창 비우기
        }
    }

    // 4. 화면에 그리기
    function showGreeting(message) {
        var chatBox = document.getElementById("chat-box");
        var myName = document.getElementById("sender").value;

        var msgDiv = document.createElement("div");
        msgDiv.classList.add("msg");

        if (message.sender === myName) {
            msgDiv.classList.add("my-msg");
            msgDiv.innerHTML = "<b>나:</b> " + message.content;
        } else {
            msgDiv.classList.add("other-msg");
            msgDiv.innerHTML = "<b>" + message.sender + ":</b> " + message.content;
        }

        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight; // 스크롤 아래로
    }
</script>
</body>
</html>
